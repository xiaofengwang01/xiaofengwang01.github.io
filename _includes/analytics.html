{% if site.analytics.google_analytics_id != "" %}
<script async src="https://www.googletagmanager.com/gtm.js?id={{ site.analytics.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("js", new Date());
</script>
{% endif %}
