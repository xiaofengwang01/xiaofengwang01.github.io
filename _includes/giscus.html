<div class="bg-white rounded-xl p-4 mb-4 giscus-card">
    <h2 class="h4 mb-3" id="comments-heading">Comments</h2>
    <div class="giscus"></div>
    <script>
        (function () {
            var isZh = (navigator.language || "en").toLowerCase().indexOf("zh") === 0;
            var lang = isZh ? "zh-CN" : "en";
            var theme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
            document.getElementById("comments-heading").textContent = isZh ? "评论" : "Comments";

            var script = document.createElement("script");
            script.src = "https://giscus.app/client.js";
            script.async = true;
            script.crossOrigin = "anonymous";
            script.setAttribute("data-repo", "xiaofengwang01/xiaofengwang01.github.io");
            script.setAttribute("data-repo-id", "R_kgDORhhD-w");
            script.setAttribute("data-category", "General");
            script.setAttribute("data-category-id", "DIC_kwDORhhD-84DLPo8");
            script.setAttribute("data-mapping", "pathname");
            script.setAttribute("data-strict", "0");
            script.setAttribute("data-reactions-enabled", "1");
            script.setAttribute("data-emit-metadata", "0");
            script.setAttribute("data-input-position", "top");
            script.setAttribute("data-theme", theme);
            script.setAttribute("data-lang", lang);
            script.setAttribute("data-loading", "lazy");
            document.querySelector(".giscus").appendChild(script);

            document.addEventListener("themechange", function (event) {
                var nextTheme = event.detail.theme === "dark" ? "dark" : "light";
                script.setAttribute("data-theme", nextTheme);
                var iframe = document.querySelector("iframe.giscus-frame");
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ giscus: { setConfig: { theme: nextTheme } } }, "https://giscus.app");
                }
            });
        })();
    </script>
</div>
